name: droidconug
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.2

environment:
  sdk: ^3.9.2

dependencies:
  card_swiper: ^3.0.1
  cupertino_icons: ^1.0.8
  dartx: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  froom: ^4.0.0
  get_it: ^8.2.0
  http: ^1.5.0
  injectable: ^2.5.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  rxdart: ^0.28.0
  sentry_flutter: ^9.7.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  sizer: ^3.0.5
  skeleton_loader: ^2.0.0+4
  sqflite: ^2.4.1
  styled_widget: ^0.4.1
  textstyle_extensions: ^2.0.0-nullsafety
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.9.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  froom_generator: ^4.0.0
  injectable_generator: ^2.9.0
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: TrebuchetMS
      fonts:
        - asset: assets/fonts/Trebuchet-MS.ttf
